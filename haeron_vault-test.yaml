---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-data
  namespace: haeron
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: haeron
data:
  vault.hcl: |
    ui = true

    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

    api_addr = "http://vault:8200"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haeron-vault
  namespace: haeron

spec:
  replicas: 1

  selector:
    matchLabels:
      app: haeron-vault

  template:
    metadata:
      labels:
        app: haeron-vault

    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.20

          args:
            - "server"
            - "-config=/vault/config/vault.hcl"

          ports:
            - name: http
              containerPort: 8200

          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"

          volumeMounts:
            - name: vault-data
              mountPath: /vault/data

            - name: vault-config
              mountPath: /vault/config
              readOnly: true

      volumes:
        - name: vault-data
          persistentVolumeClaim:
            claimName: vault-data

        - name: vault-config
          configMap:
            name: vault-config

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: haeron

spec:
  selector:
    app: haeron-vault

  ports:
    - name: http
      port: 8200
      targetPort: 8200

  type: ClusterIP
