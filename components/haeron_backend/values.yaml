# Nom de l'environnement (surchargé par values-prod.yaml / values-beta.yaml)
environment: prod

namespace: haeron

serviceAccount:
  create: true
  name: haeron-backend

backend:
  name: haeron-backend
  replicas: 1
  image:
    repository: ghcr.io/shlule/haeron_backend_ecommerce
    tag: latest
  containerPort: 8000
  imagePullSecret: ghcr-secret
  secretName: haeron-backend-secret

service:
  port: 8000
  targetPort: 8000
  type: ClusterIP

ingress:
  enabled: true
  className: traefik
  host: api.haeron-music.com
  middlewares: []          # liste vide par défaut (pas d'auth en prod)

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"