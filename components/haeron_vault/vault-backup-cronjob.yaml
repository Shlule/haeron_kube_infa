# CronJob de sauvegarde Vault (Raft) -> chiffrement GPG -> OVH Object Storage
# Rétention : 1/jour pendant 7 jours, puis 1 tous les 14 jours, max 2 ans (730 j), le reste est supprimé.
#
# Prérequis (voir instructions) :
#   kubectl -n haeron create configmap vault-retention --from-file=vault-retention.py
#   kubectl -n haeron create secret generic vault-backup-secrets \
#       --from-literal=VAULT_TOKEN=hvs.xxx \
#       --from-literal=GPG_PASSPHRASE='...' \
#       --from-literal=AWS_ACCESS_KEY_ID=... \
#       --from-literal=AWS_SECRET_ACCESS_KEY=...
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-backup
  namespace: haeron
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: haeron
spec:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-backup
          restartPolicy: OnFailure
          volumes:
            - name: snap
              emptyDir: {}
          initContainers:
            - name: snapshot
              image: hashicorp/vault:1.17
              env:
                - name: VAULT_ADDR
                  value: "http://vault:8200"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  export VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                    role=vault-backup \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  vault operator raft snapshot save /snap/vault-$(date +%Y%m%d-%H%M%S).snap
              volumeMounts:
                - name: snap
                  mountPath: /snap
          containers:
            - name: upload
              image: amazon/aws-cli:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  aws s3 cp /snap/ s3://eatable-alexander/ --recursive \
                    --endpoint-url https://s3.gra.io.cloud.ovh.net
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: {name: ovh-s3-credentials, key: access_key}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: {name: ovh-s3-credentials, key: secret_key}
              volumeMounts:
                - name: snap
                  mountPath: /snap