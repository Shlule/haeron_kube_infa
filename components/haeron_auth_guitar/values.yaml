namespace: haeron

frontend:
  name: haeron-auth-guitar
  replicas: 1
  image:
    repository: ghcr.io/shlule/haeron_auth_frontend
    tag: latest
  containerPort: 80
  imagePullSecret: ghcr-secret

service:
  port: 80
  targetPort: 80
  type: ClusterIP

ingress:
  enabled: true
  className: traefik
  host: app.haeron-music.com
  middlewares: []